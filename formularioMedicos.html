<!doctype html>
<html lang="es">

<head>
    <title>Alta Medicos</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
    <link rel="stylesheet" href="css/estilos.css" />
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
            <div class="container">

                <!-- Logo / Nombre -->
                <a class="navbar-brand fw-bold" href="index.html">
                    Centro de Salud - IDW S.A.
                </a>

                <!-- Botón Hamburguesa -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav"
                    aria-controls="menuNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Menú alineado a la derecha -->
                <div class="collapse navbar-collapse" id="menuNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="institucional.html">Institucional</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="contacto.html">Contactos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="formularioMedicos.html">Alta Medicos</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="container">
            <h1 class="text-center mb-4">Alta de Médicos 🩺</h1>

            <form id="formMedico" class="card card-body shadow p-4 mx-auto" style="max-width: 600px;">
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre completo</label>
                    <input type="text" class="form-control" id="nombre" placeholder="Ej: Dr. Juan Pérez" required>
                </div>

                <div class="mb-3">
                    <label for="especialidad" class="form-label">Especialidad</label>
                    <input type="text" class="form-control" id="especialidad" placeholder="Ej: Cardiología" required>
                </div>

                <div class="mb-3">
                    <label for="telefono" class="form-label">Teléfono</label>
                    <input type="tel" class="form-control" id="telefono" placeholder="Ej: 1123456789" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="email" placeholder="Ej: dr.juan@centromedico.com"
                        required>
                </div>
                <div class="mb-3">
                    <label for="obraSocial" class="form-label">Obra Social</label>
                    <input type="text" class="form-control" id="obraSocial" placeholder="Ej: Omint, Osdepym" required>
                </div>

                <div class="text-end">
                    <button type="submit" class="btn btn-primary">Guardar Médico</button>
                    <button type="reset" class="btn btn-secondary">Cancelar</button>
                </div>
            </form>

            <div id="mensaje" class="alert alert-success mt-4 text-center d-none">Médico guardado correctamente ✅</div>
        </div>

        <!--Lista de médicos-->
        <section>
            <h3 class="mb-3">Listado de Médicos</h3>
            <div class="table-responsive">
                <table class="table table-bordered align-middle" id="tablaMedicos">
                    <thead class="table-primary">
                        <tr>
                            <th>Nombre y Apellido</th>
                            <th>Especialidad</th>
                            <th>Teléfono</th>
                            <th>Obras Sociales</th>
                            <th>Email</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!--Los médicos se agregarán aquí dinámicamente-->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 IDW</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    </script>
    <script src="js/crud_medicos.js"></script>
</body>

</html>
