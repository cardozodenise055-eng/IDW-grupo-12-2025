<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reservas - Visitante</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="index.html">Centro de Salud - IDW S.A.</a>
    </div>
  </nav>

  <main class="container my-4">
    <h2 class="text-center mb-4">Reservar Turno</h2>

    <div class="card mb-3 shadow-sm">
      <div class="card-body">
        <h5 class="card-title">1. Seleccione Especialidad</h5>
        <select id="selectEspecialidad" class="form-control" onchange="filtrarMedicos()">
          <option value="">Seleccione una especialidad...</option>
        </select>
      </div>
    </div>

    <div class="card mb-3 shadow-sm">
      <div class="card-body">
        <h5 class="card-title">2. Seleccione Médico</h5>
        <select id="selectMedico" class="form-control" onchange="mostrarPrecio()">
          <option value="">Seleccione un médico...</option>
        </select>
        <p class="mt-2 text-muted" id="precioMedico"></p>
      </div>
    </div>

    <div class="card mb-3 shadow-sm">
      <div class="card-body">
        <h5 class="card-title">3. Ingrese Obra Social</h5>
        <div class="col-md-6">
            <input type="text" class="form-control" id="obraSocial" placeholder="Ej: Omint, Osdepym" required>
        </div>
      </div>
    </div>

    <div class="card mb-3 shadow-sm">
      <div class="card-body">
        <h5 class="card-title">4. Seleccione Turno Disponible</h5>
        <select id="selectTurno" class="form-control">
          <option value="">Seleccione día y hora...</option>
        </select>
      </div>
    </div>

    <div class="card mb-3 shadow-sm">
      <div class="card-body">
        <h5 class="card-title">Datos del Paciente</h5>
        <div class="row">
          <div class="col-md-6">
            <label for="dni">DNI</label>
            <input type="text" id="dni" class="form-control" placeholder="Ej: 40123456" />
          </div>
          <div class="col-md-6">
            <label for="nombre">Nombre y Apellido</label>
            <input type="text" id="nombre" class="form-control" placeholder="Ej: Juan Pérez" />
          </div>
        </div>
      </div>
    </div>
    
    <div class="text-center mb-4">
      <button class="btn btn-success btn-lg" onclick="reservarTurno()">Reservar Turno</button>
    </div>
  </main>

  <div class="modal fade" id="modalTicket" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title" id="modalLabel">Reserva Confirmada</h5>
          <button type="button" class="close text-white" data-bs-dismiss="modal" aria-label="Close">&times;</button>
        </div>
        <div class="modal-body" id="detalleTicket"></div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/reserva.js"></script>
</body>
</html>
