<!doctype html>
<html lang="es">

<head>
    <title>Turnos</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
    <link rel="stylesheet" href="css/estilos.css" />
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">
                    Centro de Salud - IDW S.A.
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav"
                    aria-controls="menuNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="panel.html">Panel ADMIN</a>
                        </li>
                        <li class="nav-item" id="navSesion"></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-4">
        <h2 class="text-primary mb-4">Gestión de Turnos</h2>

        <form id="form-turno" class="mb-5">
            <div class="mb-3">
                <label for="medico" class="form-label">Médico</label>
                <select id="medico" class="form-select" required></select>
            </div>

            <div class="mb-3">
                <label for="fechaHora" class="form-label">Fecha y Hora</label>
                <input type="datetime-local" id="fechaHora" class="form-control" required>
            </div>

            <div class="form-check mb-3">
                <input type="checkbox" id="disponible" class="form-check-input">
                <label for="disponible" class="form-check-label">Disponible</label>
            </div>

            <button type="submit" class="btn btn-success">Registrar Turno</button>
        </form>

        <table class="table table-bordered table-striped">
            <thead>
                <tr>
                    <th>Médico</th>
                    <th>Fecha y Hora</th>
                    <th>Disponible</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-turnos"></tbody>
        </table>

    </main>


    <footer>
        <p>&copy; 2025 IDW</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    </script>
    <script type="module" src="js/login.js"></script>
    <script src="js/turnos.js"></script>
    <script>
        const usuario = sessionStorage.getItem("usuarioLogueado");

        if (!usuario) {
            window.location.href = "login.html";
        }
    </script>
</body>
